name: Deploy Xray VLESS + Reality over Tailscale

on:
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Generate a new UUID and new Reality keys"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-xray
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Xray
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
      XRAY_PORT: ${{ secrets.XRAY_PORT || '443' }}
      REALITY_DEST: ${{ secrets.REALITY_DEST || 'www.microsoft.com:443' }}
      NODE_NAME: ${{ secrets.NODE_NAME || 'xray-reality' }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Tailscale
      # ------------------------------------------------------------

      - name: Connect GitHub Runner to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Show Tailscale status
        run: |
          set -e

          tailscale status

          echo
          echo "Tailscale IPs:"
          tailscale ip

      # ------------------------------------------------------------
      # SSH
      # ------------------------------------------------------------

      - name: Configure SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${VPS_HOST:-}" ]; then
            echo "::error::VPS_HOST secret is empty"
            exit 1
          fi

          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::VPS_SSH_KEY secret is empty"
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          cat > "$HOME/.ssh/config" <<EOF
          Host vps
            HostName ${VPS_HOST}
            User ${VPS_USER}
            Port ${SSH_PORT}
            IdentityFile ${HOME}/.ssh/id_ed25519
            StrictHostKeyChecking accept-new
            ConnectTimeout 10
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 3
          EOF

          chmod 600 "$HOME/.ssh/config"

      - name: Test SSH connection
        shell: bash
        run: |
          set -e

          echo "Testing SSH connection to VPS..."

          for i in $(seq 1 30); do
            if ssh vps 'echo "SSH_OK"; hostname; id -un' 2>/dev/null; then
              echo "VPS is reachable."
              exit 0
            fi

            echo "Waiting for VPS... ${i}/30"
            sleep 5
          done

          echo "::error::Cannot connect to VPS through Tailscale."
          echo "::error::Check VPS_HOST, Tailscale ACLs, tags and SSH service."
          exit 1

      # ------------------------------------------------------------
      # Deploy
      # ------------------------------------------------------------

      - name: Prepare setup script
        shell: bash
        run: |
          set -e

          if [ ! -f "scripts/setup-xray.sh" ]; then
            echo "::error::scripts/setup-xray.sh does not exist"
            exit 1
          fi

          chmod +x scripts/setup-xray.sh

      - name: Install and configure Xray
        shell: bash
        env:
          XRAY_UUID: ${{ secrets.XRAY_UUID }}
          REGENERATE: ${{ inputs.regenerate && '1' || '0' }}
        run: |
          set -euo pipefail

          echo "Uploading setup script..."

          scp scripts/setup-xray.sh vps:/tmp/setup-xray.sh

          ssh vps \
            "chmod 700 /tmp/setup-xray.sh && \
             XRAY_UUID='${XRAY_UUID}' \
             XRAY_PORT='${XRAY_PORT}' \
             REALITY_DEST='${REALITY_DEST}' \
             NODE_NAME='${NODE_NAME}' \
             REGENERATE='${REGENERATE}' \
             bash /tmp/setup-xray.sh"

      # ------------------------------------------------------------
      # Verify
      # ------------------------------------------------------------

      - name: Verify Xray service
        shell: bash
        run: |
          set -e

          ssh vps '
            echo "=== Xray service ==="
            systemctl is-enabled xray || true
            systemctl is-active xray

            echo
            echo "=== Listening ports ==="
            ss -lntp | grep ":${XRAY_PORT}" || true

            echo
            echo "=== Xray status ==="
            systemctl --no-pager --full status xray | tail -n 30
          '

      # ------------------------------------------------------------
      # Fetch links
      # ------------------------------------------------------------

      - name: Fetch generated VLESS links
        shell: bash
        run: |
          set -e

          rm -f vless-link.txt

          scp vps:/tmp/vless-link.txt ./vless-link.txt

          if [ ! -s ./vless-link.txt ]; then
            echo "::error::vless-link.txt is empty or missing"
            exit 1
          fi

          echo "VLESS links fetched successfully."

      # ------------------------------------------------------------
      # Job Summary
      # ------------------------------------------------------------

      - name: Write links to Job Summary
        shell: bash
        run: |
          {
            echo "## VLESS + Reality"
            echo
            echo '```text'
            cat vless-link.txt
            echo '```'
            echo
            echo "⚠️ این فایل شامل UUID و اطلاعات اتصال است."
            echo "آن را در ریپوی عمومی یا کانال عمومی قرار نده."
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------
      # Artifact
      # ------------------------------------------------------------

      - name: Upload VLESS configuration
        uses: actions/upload-artifact@v4
        with:
          name: vless-link
          path: vless-link.txt
          if-no-files-found: error
          retention-days: 7
