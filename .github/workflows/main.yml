name: Deploy Xray (VLESS + Reality) over Tailscale

# اجرای دستی از تب Actions. با تیک زدن regenerate، کانفیگ قبلی باطل و UUID/کلیدهای جدید ساخته می‌شود.
on:
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Re-generate UUID and Reality keys (old links become invalid)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-xray
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
      XRAY_PORT: ${{ secrets.XRAY_PORT || '443' }}
      REALITY_DEST: ${{ secrets.REALITY_DEST || 'www.microsoft.com:443' }}
      NODE_NAME: ${{ secrets.NODE_NAME || 'xray-reality' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # رانر گیت‌هاب به‌عنوان یک دستگاه با تگ tag:ci وارد شبکهٔ Tailscale می‌شود
      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Set up SSH client
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking accept-new
            ServerAliveInterval 15
          EOF

      - name: Wait for VPS over Tailscale
        run: |
          ok=0
          for i in $(seq 1 30); do
            if ssh vps 'echo ok' >/dev/null 2>&1; then ok=1; break; fi
            echo "waiting for VPS over tailscale... ($i/30)"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::VPS ($VPS_HOST) از طریق Tailscale در دسترس نیست — ACL، تگ‌ها و tailscale status روی سرور را بررسی کنید"
            exit 1
          fi

      - name: Install & configure Xray on VPS
        env:
          XRAY_UUID: ${{ secrets.XRAY_UUID }}
          REGENERATE: ${{ inputs.regenerate == true && '1' || '0' }}
        run: |
          ssh vps "env XRAY_UUID='$XRAY_UUID' XRAY_PORT='$XRAY_PORT' REALITY_DEST='$REALITY_DEST' NODE_NAME='$NODE_NAME' REGENERATE='$REGENERATE' bash -s" < scripts/setup-xray.sh

      - name: Fetch generated vless links
        run: |
          scp vps:/tmp/vless-link.txt vless-link.txt
          echo "links fetched"

      - name: Write links to job summary
        run: |
          {
            echo "## 🔗 کانفیگ VLESS + Reality ساخته شد"
            echo ""
            echo "خط اول: اتصال با IP عمومی (از هر جای دنیا) — خط دوم: اتصال با IP تیل‌اسکیل (فقط برای دستگاه‌های داخل شبکهٔ Tailscale)"
            echo ""
            echo '```'
            cat vless-link.txt
            echo '```'
            echo ""
            echo "> ⚠️ این لینک شامل UUID (معادل رمز عبور) است. آن را فقط در ریپوی خصوصی/کانال امن نگه دارید."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload links as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vless-link
          path: vless-link.txt
          retention-days: 30
