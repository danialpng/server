
name: Temporary VLESS Reality

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xray:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Connect Runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Install Xray
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y curl jq openssl

          curl -L \
            https://github.com/XTLS/Xray-install/raw/main/install-release.sh \
            -o /tmp/install-xray.sh

          sudo bash /tmp/install-xray.sh install

          xray version

      - name: Generate real Xray credentials
        shell: bash
        run: |
          set -euo pipefail

          UUID="$(xray uuid)"

          KEY_OUTPUT="$(xray x25519)"

          PRIVATE_KEY="$(echo "$KEY_OUTPUT" | awk -F': ' '/PrivateKey/ {print $2}')"
          PUBLIC_KEY="$(echo "$KEY_OUTPUT" | awk -F': ' '/Password/ {print $2}')"

          SHORT_ID="$(openssl rand -hex 8)"

          echo "UUID=$UUID" >> "$GITHUB_ENV"
          echo "PRIVATE_KEY=$PRIVATE_KEY" >> "$GITHUB_ENV"
          echo "PUBLIC_KEY=$PUBLIC_KEY" >> "$GITHUB_ENV"
          echo "SHORT_ID=$SHORT_ID" >> "$GITHUB_ENV"

          echo "Credentials generated successfully."

      - name: Get Tailscale IP
        shell: bash
        run: |
          set -euo pipefail

          TS_IP="$(tailscale ip -4)"

          if [ -z "$TS_IP" ]; then
            echo "::error::Could not get Tailscale IPv4"
            exit 1
          fi

          echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"

          echo "Runner Tailscale IP:"
          echo "$TS_IP"

      - name: Create Xray configuration
        shell: bash
        run: |
          set -euo pipefail

          sudo mkdir -p /usr/local/etc/xray

          sudo tee /usr/local/etc/xray/config.json > /dev/null <<EOF
          {
            "log": {
              "loglevel": "warning"
            },

            "inbounds": [
              {
                "listen": "0.0.0.0",
                "port": 443,
                "protocol": "vless",

                "settings": {
                  "clients": [
                    {
                      "id": "${UUID}",
                      "flow": "xtls-rprx-vision"
                    }
                  ],
                  "decryption": "none"
                },

                "streamSettings": {
                  "network": "tcp",
                  "security": "reality",

                  "realitySettings": {
                    "show": false,
                    "target": "www.microsoft.com:443",
                    "xver": 0,

                    "serverNames": [
                      "www.microsoft.com"
                    ],

                    "privateKey": "${PRIVATE_KEY}",

                    "shortIds": [
                      "${SHORT_ID}"
                    ]
                  }
                }
              }
            ],

            "outbounds": [
              {
                "protocol": "freedom"
              }
            ]
          }
          EOF

          echo "Testing Xray configuration..."

          sudo xray run \
            -test \
            -config /usr/local/etc/xray/config.json

      - name: Start temporary Xray
        shell: bash
        run: |
          set -euo pipefail

          sudo nohup xray run \
            -config /usr/local/etc/xray/config.json \
            > /tmp/xray.log 2>&1 &

          sleep 3

          if ! pgrep -x xray > /dev/null; then
            echo "::error::Xray failed to start."
            cat /tmp/xray.log
            exit 1
          fi

          echo "Xray is running."

      - name: Generate VLESS configuration
        shell: bash
        run: |
          set -euo pipefail

          VLESS_URL="vless://${UUID}@${TS_IP}:443?type=tcp&security=reality&pbk=${PUBLIC_KEY}&fp=chrome&sni=www.microsoft.com&sid=${SHORT_ID}&flow=xtls-rprx-vision#github-temporary"

          printf '%s\n' "$VLESS_URL" > vless.txt

          sudo cp /usr/local/etc/xray/config.json xray-server.json

          cat > client-info.txt <<EOF
          Server: ${TS_IP}
          Port: 443
          Protocol: VLESS
          Security: REALITY
          SNI: www.microsoft.com
          UUID: ${UUID}
          PublicKey: ${PUBLIC_KEY}
          ShortID: ${SHORT_ID}
          Flow: xtls-rprx-vision
          EOF

          echo "===== VLESS CONFIG ====="
          cat vless.txt

      - name: Add configuration to Summary
        shell: bash
        run: |
          {
            echo "## Temporary VLESS + Reality"
            echo
            echo "Runner Tailscale IP:"
            echo "\`${TS_IP}\`"
            echo
            echo '```text'
            cat vless.txt
            echo '```'
            echo
            echo "⚠️ این کانفیگ فقط تا زمانی معتبر است که همین GitHub Job و Runner فعال باشند."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload configuration
        uses: actions/upload-artifact@v4
        with:
          name: temporary-vless-reality
          path: |
            vless.txt
            client-info.txt
            xray-server.json
          retention-days: 1

      - name: Keep Xray alive
        shell: bash
        run: |
          echo "Xray is running."
          echo "Tailscale IP: ${TS_IP}"
          echo "The temporary server will stop when this workflow ends."

          for i in $(seq 1 25); do
            echo "Running... ${i}/25"
            sleep 60
          done
