
name: Generate VLESS Reality Config

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl uuid-runtime

      - name: Generate VLESS Reality configuration
        shell: bash
        run: |
          set -euo pipefail

          UUID="$(uuidgen)"

          PRIVATE_KEY="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')"
          PUBLIC_KEY="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')"

          SHORT_ID="$(openssl rand -hex 8)"

          SERVER="127.0.0.1"
          PORT="443"
          SNI="www.microsoft.com"

          cat > config.json <<EOF
          {
            "log": {
              "loglevel": "warning"
            },
            "inbounds": [
              {
                "listen": "127.0.0.1",
                "port": ${PORT},
                "protocol": "vless",
                "settings": {
                  "clients": [
                    {
                      "id": "${UUID}",
                      "flow": "xtls-rprx-vision"
                    }
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "tcp",
                  "security": "reality",
                  "realitySettings": {
                    "show": false,
                    "dest": "${SNI}:443",
                    "xver": 0,
                    "serverNames": [
                      "${SNI}"
                    ],
                    "privateKey": "${PRIVATE_KEY}",
                    "shortIds": [
                      "${SHORT_ID}"
                    ]
                  }
                }
              }
            ],
            "outbounds": [
              {
                "protocol": "freedom"
              }
            ]
          }
          EOF

          VLESS="vless://${UUID}@${SERVER}:${PORT}?type=tcp&security=reality&pbk=${PUBLIC_KEY}&fp=chrome&sni=${SNI}&sid=${SHORT_ID}&flow=xtls-rprx-vision#temporary-xray"

          printf '%s\n' "$VLESS" > vless.txt

          echo "VLESS configuration generated."
          echo "Files:"
          echo "  config.json"
          echo "  vless.txt"

      - name: Upload configuration
        uses: actions/upload-artifact@v4
        with:
          name: vless-reality-config
          path: |
            config.json
            vless.txt
          retention-days: 1
