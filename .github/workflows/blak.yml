name: Ubuntu SSH Password with Tailscale

on:
  workflow_dispatch:

jobs:
  ssh-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install OpenSSH
        run: |
          sudo apt update
          sudo apt install -y openssh-server git curl expect
          sudo systemctl enable ssh
          sudo systemctl start ssh

      - name: Create SSH user with password
        run: |
          USER=sshuser
          PASSWORD=$(openssl rand -base64 12)

          sudo useradd -m -s /bin/bash $USER
          echo "$USER:$PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo $USER

          echo "SSH_USER=$USER" >> $GITHUB_ENV
          echo "SSH_PASS=$PASSWORD" >> $GITHUB_ENV

      - name: Enable SSH password login
        run: |
          sudo sed -i 's/^#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh

      - name: Install T2HASH
        run: |
          git clone https://github.com/T2HASH/T2HASH-CORE.git

          cd T2HASH-CORE/t2tunnel

          expect <<'EOF'
          spawn sudo bash install.sh

          expect {
              "Select" {
                  send "1\r"
                  exp_continue
              }
              "select" {
                  send "1\r"
                  exp_continue
              }
              "选择" {
                  send "1\r"
                  exp_continue
              }
              "سرور" {
                  send "1\r"
                  exp_continue
              }
              timeout {
                  exit 1
              }
              eof
          }
          EOF

          printf "2\n" | sudo bash install.sh

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=gh-ssh-$GITHUB_RUN_ID

      - name: Get Tailscale IP
        run: |
          TS_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Show SSH access info
        run: |
          echo ""
          echo "========== SSH ACCESS =========="
          echo "IP:       $TAILSCALE_IP"
          echo "User:     $SSH_USER"
          echo "Password: $SSH_PASS"
          echo ""
          echo "SSH:"
          echo "ssh $SSH_USER@$TAILSCALE_IP"
          echo ""
          echo "Port Forward:"
          echo "ssh -L 2331:127.0.0.1:2331 $SSH_USER@$TAILSCALE_IP"
          echo "================================"

      - name: Keep runner alive
        run: |
          while true; do
            sleep 300
          done
