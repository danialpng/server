      - name: Debug T2HASH installer
        run: |
          git clone https://github.com/T2HASH/T2HASH-CORE.git
          cd T2HASH-CORE/t2tunnel

          echo "===== INPUT CODE ====="
          grep -n -E 'Choose|type 1|read .*choice|/dev/tty|select' install.sh || true

          echo "===== INSTALLER HEAD ====="
          sed -n '1,220p' install.shname: T2HASH Foreign Server + SSH + Tailscale

on:
  workflow_dispatch:

jobs:
  ssh-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y openssh-server git curl expect openssl
          sudo systemctl enable ssh
          sudo systemctl start ssh

      - name: Create SSH user
        run: |
          USER=sshuser
          PASSWORD=$(openssl rand -base64 12 | tr -dc 'A-Za-z0-9' | head -c 16)

          sudo useradd -m -s /bin/bash "$USER"
          echo "$USER:$PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo "$USER"

          echo "SSH_USER=$USER" >> "$GITHUB_ENV"
          echo "SSH_PASS=$PASSWORD" >> "$GITHUB_ENV"

      - name: Enable SSH password login
        run: |
          sudo sed -i \
            -e 's/^#PasswordAuthentication yes/PasswordAuthentication yes/' \
            -e 's/^PasswordAuthentication no/PasswordAuthentication yes/' \
            /etc/ssh/sshd_config

          sudo systemctl restart ssh

      - name: Install T2HASH
        run: |
          git clone https://github.com/T2HASH/T2HASH-CORE.git
          cd T2HASH-CORE/t2tunnel

          expect <<'EOF'
          set timeout 300

          spawn sudo bash install.sh

          expect {
              -re {Choose \[1/2\]:} {
                  send "2\r"
                  exp_continue
              }

              -re {type 1 or 2} {
                  send "2\r"
                  exp_continue
              }

              eof {
                  catch wait result
                  exit [lindex $result 3]
              }

              timeout {
                  puts "ERROR: T2HASH installer timed out."
                  exit 1
              }
          }
          EOF

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" \
            --hostname="gh-t2hash-$GITHUB_RUN_ID"

      - name: Get Tailscale IP
        run: |
          TS_IP=$(tailscale ip -4)

          if [ -z "$TS_IP" ]; then
            echo "ERROR: Tailscale IP was not detected."
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

      - name: Show connection information
        run: |
          echo ""
          echo "=========================================="
          echo "       T2HASH FOREIGN SERVER"
          echo "=========================================="
          echo "Tailscale IP : $TAILSCALE_IP"
          echo "SSH User     : $SSH_USER"
          echo "SSH Password : $SSH_PASS"
          echo ""
          echo "SSH:"
          echo "ssh $SSH_USER@$TAILSCALE_IP"
          echo ""
          echo "T2HASH Panel:"
          echo "http://$TAILSCALE_IP:2332"
          echo ""
          echo "SSH Port Forward:"
          echo "ssh -L 2332:127.0.0.1:2332 $SSH_USER@$TAILSCALE_IP"
          echo "=========================================="
          echo ""

      - name: Keep runner alive
        run: |
          while true; do
            sleep 300
          done
