
name: Deploy Xray VLESS Reality

on:
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Generate new UUID and Reality keys"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    name: Install Xray on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. CONNECT GITHUB RUNNER TO TAILSCALE
      # =========================================================

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Check Tailscale
        run: |
          set -e

          echo "===== Tailscale status ====="
          tailscale status

          echo
          echo "===== Runner Tailscale IP ====="
          tailscale ip

      # =========================================================
      # 3. CHECK VPS
      # =========================================================

      - name: Check VPS_HOST
        run: |
          set -e

          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "::error::VPS_HOST is empty"
            exit 1
          fi

          echo "VPS_HOST is configured."

      # =========================================================
      # 4. CONFIGURE SSH
      # =========================================================

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::VPS_SSH_KEY is empty"
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          cat > "$HOME/.ssh/config" <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_SSH_PORT
            IdentityFile $HOME/.ssh/id_ed25519
            StrictHostKeyChecking accept-new
            ConnectTimeout 10
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 3
          EOF

          chmod 600 "$HOME/.ssh/config"

      # =========================================================
      # 5. TEST TAILSCALE + SSH
      # =========================================================

      - name: Test VPS connection
        run: |
          set -e

          echo "Testing VPS through Tailscale..."

          for i in $(seq 1 30); do

            if ssh vps 'echo SSH_OK && hostname && id -un'; then
              echo
              echo "VPS connection successful."
              exit 0
            fi

            echo "Waiting for VPS... $i/30"
            sleep 5

          done

          echo "::error::Cannot connect to VPS."
          echo "::error::Make sure VPS is online in Tailscale and SSH is enabled."
          exit 1

      # =========================================================
      # 6. INSTALL XRAY
      # =========================================================

      - name: Install Xray
        env:
          XRAY_PORT: ${{ secrets.XRAY_PORT || '443' }}
          REALITY_DEST: ${{ secrets.REALITY_DEST || 'www.microsoft.com:443' }}
          NODE_NAME: ${{ secrets.NODE_NAME || 'xray-reality' }}
          REGENERATE: ${{ inputs.regenerate && '1' || '0' }}
          XRAY_UUID: ${{ secrets.XRAY_UUID }}
        run: |
          set -euo pipefail

          ssh vps \
            "XRAY_PORT='$XRAY_PORT' \
             REALITY_DEST='$REALITY_DEST' \
             NODE_NAME='$NODE_NAME' \
             REGENERATE='$REGENERATE' \
             XRAY_UUID='$XRAY_UUID' \
             bash -s" <<'REMOTE_SCRIPT'

          set -euo pipefail

          echo "================================"
          echo "Installing Xray"
          echo "================================"

          # -------------------------------------------------------
          # Root check
          # -------------------------------------------------------

          if [ "$(id -u)" != "0" ]; then
            echo "This script must run as root."
            exit 1
          fi

          # -------------------------------------------------------
          # Detect OS
          # -------------------------------------------------------

          if [ ! -f /etc/os-release ]; then
            echo "Unsupported operating system."
            exit 1
          fi

          . /etc/os-release

          echo "OS: $PRETTY_NAME"

          # -------------------------------------------------------
          # Install dependencies
          # -------------------------------------------------------

          export DEBIAN_FRONTEND=noninteractive

          apt-get update

          apt-get install -y \
            curl \
            unzip \
            openssl \
            ca-certificates \
            uuid-runtime

          # -------------------------------------------------------
          # Install Xray
          # -------------------------------------------------------

          if ! command -v xray >/dev/null 2>&1; then

            echo "Downloading Xray installer..."

            bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install

          else

            echo "Xray already installed."

          fi

          # -------------------------------------------------------
          # Create directories
          # -------------------------------------------------------

          mkdir -p /usr/local/etc/xray
          mkdir -p /var/log/xray

          # -------------------------------------------------------
          # UUID
          # -------------------------------------------------------

          if [ "$REGENERATE" = "1" ] || [ -z "${XRAY_UUID:-}" ]; then

            UUID="$(cat /proc/sys/kernel/random/uuid)"

            echo "Generated new UUID."

          else

            UUID="$XRAY_UUID"

            echo "Using existing UUID."

          fi

          # -------------------------------------------------------
          # Reality keys
          # -------------------------------------------------------

          KEY_FILE="/usr/local/etc/xray/reality.keys"

          if [ "$REGENERATE" = "1" ] || [ ! -f "$KEY_FILE" ]; then

            echo "Generating new Reality keys..."

            xray x25519 > "$KEY_FILE"

          else

            echo "Using existing Reality keys."

          fi

          PRIVATE_KEY="$(grep -i 'PrivateKey' "$KEY_FILE" | awk -F': ' '{print $2}')"
          PUBLIC_KEY="$(grep -i 'Password' "$KEY_FILE" | awk -F': ' '{print $2}')"

          if [ -z "$PRIVATE_KEY" ] || [ -z "$PUBLIC_KEY" ]; then
            echo "Could not read Reality keys."
            cat "$KEY_FILE"
            exit 1
          fi

          # -------------------------------------------------------
          # Short ID
          # -------------------------------------------------------

          SHORT_ID_FILE="/usr/local/etc/xray/reality.shortid"

          if [ "$REGENERATE" = "1" ] || [ ! -f "$SHORT_ID_FILE" ]; then

            openssl rand -hex 8 > "$SHORT_ID_FILE"

          fi

          SHORT_ID="$(cat "$SHORT_ID_FILE")"

          # -------------------------------------------------------
          # Server IP
          # -------------------------------------------------------

          SERVER_IP="$(curl -4 -fsS https://api.ipify.org || true)"

          if [ -z "$SERVER_IP" ]; then
            echo "Could not detect public IPv4."
            exit 1
          fi

          echo "Public IP: $SERVER_IP"

          # -------------------------------------------------------
          # Create Xray config
          # -------------------------------------------------------

          cat > /usr/local/etc/xray/config.json <<EOF
          {
            "log": {
              "loglevel": "warning"
            },

            "inbounds": [
              {
                "listen": "0.0.0.0",
                "port": ${XRAY_PORT},
                "protocol": "vless",

                "settings": {
                  "clients": [
                    {
                      "id": "${UUID}",
                      "flow": "xtls-rprx-vision"
                    }
                  ],
                  "decryption": "none"
                },

                "streamSettings": {
                  "network": "tcp",
                  "security": "reality",

                  "realitySettings": {
                    "show": false,
                    "dest": "${REALITY_DEST}",
                    "xver": 0,

                    "serverNames": [
                      "${REALITY_DEST%%:*}"
                    ],

                    "privateKey": "${PRIVATE_KEY}",

                    "shortIds": [
                      "${SHORT_ID}"
                    ]
                  }
                }
              }
            ],

            "outbounds": [
              {
                "protocol": "freedom",
                "tag": "direct"
              },

              {
                "protocol": "blackhole",
                "tag": "blocked"
              }
            ]
          }
          EOF

          # -------------------------------------------------------
          # Validate config
          # -------------------------------------------------------

          echo "Testing Xray configuration..."

          xray run -test -config /usr/local/etc/xray/config.json

          # -------------------------------------------------------
          # Start service
          # -------------------------------------------------------

          systemctl daemon-reload
          systemctl enable xray
          systemctl restart xray

          sleep 2

          if ! systemctl is-active --quiet xray; then

            echo "Xray failed to start."

            systemctl --no-pager status xray || true
            journalctl -u xray --no-pager -n 50 || true

            exit 1

          fi

          # -------------------------------------------------------
          # Firewall
          # -------------------------------------------------------

          if command -v ufw >/dev/null 2>&1; then

            ufw allow "${XRAY_PORT}/tcp" || true

          fi

          # -------------------------------------------------------
          # Generate VLESS link
          # -------------------------------------------------------

          LINK_FILE="/tmp/vless-link.txt"

          VLESS_LINK="vless://${UUID}@${SERVER_IP}:${XRAY_PORT}?type=tcp&security=reality&pbk=${PUBLIC_KEY}&fp=chrome&sni=${REALITY_DEST%%:*}&sid=${SHORT_ID}&flow=xtls-rprx-vision#${NODE_NAME}"

          printf '%s\n' "$VLESS_LINK" > "$LINK_FILE"

          chmod 600 "$LINK_FILE"

          # -------------------------------------------------------
          # Save information
          # -------------------------------------------------------

          cat > /usr/local/etc/xray/node-info.txt <<EOF
          UUID=${UUID}
          SERVER_IP=${SERVER_IP}
          PORT=${XRAY_PORT}
          PUBLIC_KEY=${PUBLIC_KEY}
          SHORT_ID=${SHORT_ID}
          SNI=${REALITY_DEST%%:*}
          NODE_NAME=${NODE_NAME}
          EOF

          chmod 600 /usr/local/etc/xray/node-info.txt

          echo
          echo "================================"
          echo "Xray installation completed"
          echo "================================"

          systemctl is-active xray

          echo
          echo "Listening:"
          ss -lntp | grep ":${XRAY_PORT}" || true

          REMOTE_SCRIPT

      # =========================================================
      # 7. GET CONFIG
      # =========================================================

      - name: Download VLESS configuration
        run: |
          set -e

          scp vps:/tmp/vless-link.txt ./vless-link.txt

          if [ ! -s ./vless-link.txt ]; then
            echo "::error::VLESS link was not generated."
            exit 1
          fi

          echo "VLESS configuration received."

      # =========================================================
      # 8. SUMMARY
      # =========================================================

      - name: Show VLESS configuration
        run: |
          {
            echo "## Xray VLESS + Reality"
            echo
            echo '```text'
            cat vless-link.txt
            echo '```'
            echo
            echo "⚠️ این لینک خصوصی است."
          } >> "$GITHUB_STEP_SUMMARY"

      # =========================================================
      # 9. ARTIFACT
      # =========================================================

      - name: Upload VLESS configuration
        uses: actions/upload-artifact@v4
        with:
          name: vless-vless-reality
          path: vless-link.txt
          if-no-files-found: error
          retention-days: 7
